# ==============================================================================
#
#               OpenTelemetry Collector - ClusterRole
#
# ==============================================================================
#
# Overview:
#   This manifest defines a `ClusterRole` that grants the OTel Collector
#   permissions to read certain Kubernetes resources.
#
# Permissions Rationale:
#   The OTel Collector's `k8sattributes` processor needs to access the Kubernetes
#   API to enrich telemetry data with metadata about the source of that data.
#   For example, when a metric is received, the processor can use these
#   permissions to look up the pod it came from and add labels like `k8s.pod.name`,
#   `k8s.namespace.name`, and `k8s.node.name` to the metric. This makes the
#   telemetry data much more useful for debugging and analysis.
#
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
  labels:
    component: otel-collector
rules:
# Grants read-only access to core resources.
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes"]
  verbs: ["get", "watch", "list"]
# Grants read-only access to ReplicaSets, which helps in identifying the owner of a pod.
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "watch", "list"]
