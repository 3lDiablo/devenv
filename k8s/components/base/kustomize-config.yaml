# ==============================================================================
#
#               Kustomize - Common Transformation Configuration
#
# ==============================================================================
#
# Overview:
#   This file defines a common configuration that is applied to all resources
#   processed by the `base/kustomization.yaml`. It allows for defining custom
#   transformation rules that are not covered by standard Kustomize fields.
#
#   In this case, it's used to specify which fields in the Kubernetes manifests
#   are eligible for variable substitution from the `global-values` ConfigMap
#   that gets generated by the Taskfile.
#
# ==============================================================================

# ------------------------------------------------------------------------------
# § Variable Reference Configuration
#   This section tells Kustomize which specific resource fields should be
#   scanned for variable placeholders (e.g., `$(VAR_NAME)`). When Kustomize
#   builds the overlay, it will replace these placeholders with the corresponding
#   values from the `global-values` ConfigMap.
# ------------------------------------------------------------------------------
varReference:
  # Allows variable substitution in the `value` field of environment variables
  # within a Deployment's container spec. This is the primary way that runtime
  # configuration from `config.yaml` is passed into application pods.
  #
  # Example:
  #   env:
  #   - name: POSTGRES_USER
  #     value: "$(settings_postgres_user)" # This gets replaced by Kustomize.
  #
  - kind: Deployment
    path: spec/template/spec/containers/env/value

  # Allows variable substitution in the `nodePort` field of a Service.
  # This is used to assign the specific NodePorts defined in `config.yaml`
  # to our services, ensuring they are accessible from the host machine at
  # predictable ports.
  #
  # Example:
  #   ports:
  #   - name: http
  #     port: 8080
  #     nodePort: $(cluster_ports_redpanda-console_node) # This gets replaced.
  #
  - kind: Service
    path: spec/ports/nodePort
