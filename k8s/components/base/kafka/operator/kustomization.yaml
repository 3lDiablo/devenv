# ==============================================================================
#
#               Kustomize - Strimzi Operator Component
#
# ==============================================================================
#
# Overview:
#   This Kustomization file bundles all the resources required to deploy the
#   Strimzi Kafka Operator itself. The operator is a powerful controller that
#   runs in the cluster and manages the lifecycle of Kafka clusters, topics,
#   users, and other related components.
#
#   The resources include:
#   -   CRDs (Custom Resource Definitions): These extend the Kubernetes API to
#       understand Strimzi-specific kinds like `Kafka`, `KafkaTopic`, etc.
#   -   RBAC (Role-Based Access Control): Defines the permissions the operator
#       needs to manage resources in the cluster.
#   -   Deployment: The main workload that runs the operator's controller logic.
#   -   ServiceAccount: The identity the operator pod uses.
#   -   ConfigMap: Contains configuration for the operator itself.
#
# ==============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ------------------------------------------------------------------------------
# § Component Resources
#   Lists all the manifests that constitute the Strimzi Operator.
# ------------------------------------------------------------------------------
resources:
  # --- RBAC (Permissions) ---
  # Defines permissions for the operator within the namespace it's deployed to.
  - clusterrole-namespaced.yaml
  - rolebinding-namespaced.yaml
  # Defines cluster-wide permissions needed by the operator.
  - clusterrole-global.yaml
  - clusterrolebinding-global.yaml
  # Defines permissions for leader election to ensure only one operator instance is active.
  - clusterrole-leader-election.yaml
  - rolebinding-leader-election.yaml
  # Defines permissions for the namespaces the operator is configured to "watch".
  - clusterrole-watched.yaml
  - rolebinding-watched.yaml
  # Defines permissions that the operator can delegate to the Kafka broker pods.
  - clusterrole-kafka-broker.yaml
  - clusterrolebinding-kafka-broker-delegation.yaml
  # Defines permissions for the Entity Operator (which manages topics and users).
  - clusterrole-entity-operator.yaml
  - rolebinding-entity-operator-delegation.yaml
  # Defines permissions that can be delegated to Kafka client applications.
  - clusterrole-kafka-client.yaml
  - clusterrolebinding-kafka-client-delegation.yaml

  # --- Operator Configuration ---
  # Contains configuration settings for the Strimzi operator itself.
  - configmap.yaml

  # --- Custom Resource Definitions (CRDs) ---
  # These files define the custom `kind`s that Strimzi introduces to Kubernetes.
  # Applying these CRDs teaches the Kubernetes API about Strimzi objects.
  - crd-kafka.yaml              # Defines the `Kafka` resource.
  - crd-kafkabridge.yaml        # Defines the `KafkaBridge` resource.
  - crd-kafkaconnect.yaml       # Defines the `KafkaConnect` resource.
  - crd-kafkaconnector.yaml     # Defines the `KafkaConnector` resource.
  - crd-kafkamirrormaker2.yaml  # Defines the `KafkaMirrorMaker2` resource.
  - crd-kafkanodepool.yaml      # Defines the `KafkaNodePool` resource.
  - crd-kafkarebalance.yaml     # Defines the `KafkaRebalance` resource.
  - crd-kafkatopic.yaml         # Defines the `KafkaTopic` resource.
  - crd-kafkauser.yaml          # Defines the `KafkaUser` resource.
  - crd-strimzipodset.yaml      # Defines the `StrimziPodSet` resource (an internal implementation detail).

  # --- Operator Workload ---
  # The Deployment that runs the operator pod.
  - deployment.yaml
  # The ServiceAccount provides an identity for the operator pod to interact with the Kubernetes API.
  - serviceaccount.yaml
