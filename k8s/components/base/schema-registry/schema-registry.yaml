apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: infrastructure
  labels:
    component: schema-registry
spec:
  # APICURIO REGISTRY: Manages Avro, JSON Schema, and Protobuf definitions.
  # WHY APICURIO? It is lightweight, Open Source, and uses a standard SQL 
  # database (Postgres) for storage, avoiding the complexity of Kafka-based storage 
  # for local development.
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
        component: schema-registry
    spec:
      containers:
      - name: apicurio
        image: quay.io/apicurio/apicurio-registry-sql:2.6.x-release
        ports:
        - containerPort: 8080
          name: http
        env:
        # STORAGE: Connected to the internal Postgres instance.
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: "jdbc:postgresql://postgres:5432/postgres"
        - name: QUARKUS_DATASOURCE_USERNAME
          value: "postgres"
        - name: QUARKUS_DATASOURCE_PASSWORD
          value: "postgres"
        # JAVA CONFIG: Memory is auto-sized by Taskfile, but we provide defaults.
        - name: JAVA_OPTIONS
          value: "-Xms128m -Xmx128m"
        - name: REGISTRY_APIS_V2_DATE_FORMAT
          value: "yyyy-MM-dd'T'HH:mm:ss'Z'"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: infrastructure
  labels:
    component: schema-registry
spec:
  # EXPOSURE: NodePort 30081 provides Confluent-compatible schema registry API.
  type: NodePort
  ports:
  - port: 8081
    targetPort: 8080
    name: http
    nodePort: 30081
  selector:
    app: schema-registry
