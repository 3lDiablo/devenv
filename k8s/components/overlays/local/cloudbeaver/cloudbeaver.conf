# ==============================================================================
#
#               CloudBeaver - Main Configuration Template
#
# ==============================================================================
#
# Overview:
#   This file is a template for CloudBeaver's primary configuration (`cloudbeaver.conf`).
#   CloudBeaver uses a database to store its own internal state, such as user
#   accounts, saved connections, and settings. This configuration tells CloudBeaver
#   how to connect to the PostgreSQL database for this purpose.
#
# Rendering:
#   This is a template file, not a final configuration. The `Taskfile`'s
#   `render:cloudbeaver` task processes this file using `yq`. It injects the
#   database URL, user, and password from `config.yaml` to produce the final
#   `cloudbeaver.conf` file. This final file is then stored in a ConfigMap and
#   mounted into the CloudBeaver pod.
#
# ==============================================================================
{"server": {"serverName": "CloudBeaver", "serverPort": 8978, "workspaceLocation": "workspace", "contentRoot": "web", "driversLocation": "drivers", "rootURI": "/", "serviceURI": "/api/", "productConfiguration": "conf/product.conf", "expireSessionAfterPeriod": 1800000, "develMode": false, "enableSecurityManager": true, "database": {"driver": "postgresql", "url": "jdbc:postgresql://postgres:5432/cloudbeaver", "user": "postgres", "password": "postgres", "createDatabase": true, "pool": {"minIdleConnections": 4, "maxIdleConnections": 10, "maxConnections": 100, "validationQuery": "SELECT 1"}}}, "app": {"anonymousAccessEnabled": false, "anonymousUserRole": "user", "supportsCustomConnections": true, "publicCredentialsSaveEnabled": false, "adminCredentialsSaveEnabled": false, "resourceManagerEnabled": true, "enabledAuthProviders": ["local"], "disabledDrivers": ["h2:h2_embedded", "h2:h2_embedded_v2", "clickhouse:yandex_clickhouse", "generic:duckdb_jdbc", "sqlite:sqlite_jdbc"]}}
