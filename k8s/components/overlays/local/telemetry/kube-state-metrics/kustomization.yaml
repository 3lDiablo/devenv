# ==============================================================================
#
#               Kustomize Overlay - Kube State Metrics
#
# ==============================================================================
#
# Overview:
#   This Kustomization file defines the `local` overlay for `kube-state-metrics`.
#   Its primary purpose is to include the base manifests.
#
#   The actual patching (e.g., setting resource limits, image tag) is handled
#   by the `replacements` defined in the top-level `telemetry.yaml` replacement
#   file.
#
# ==============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Includes the base manifests for kube-state-metrics.
resources:
  - ../../../../base/telemetry/kube-state-metrics
