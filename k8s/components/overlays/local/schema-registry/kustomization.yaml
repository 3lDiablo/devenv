# ==============================================================================
#
#               Kustomize Overlay - Apicurio Schema Registry
#
# ==============================================================================
#
# Overview:
#   This Kustomization file defines the `local` overlay for the Apicurio Schema
#   Registry. Its primary purpose is to include the base manifests and apply a
#   consistent label.
#
#   The actual patching (e.g., setting resource limits, image tag, DB credentials)
#   is handled by the `replacements` defined in the top-level
#   `overlays/local/kustomization.yaml`.
#
# ==============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Adds a common label to the Deployment and Service.
labels:
- includeSelectors: true
  pairs:
    component: schema-registry

# Includes the base manifests for the Schema Registry.
resources:
  - ../../../base/schema-registry
