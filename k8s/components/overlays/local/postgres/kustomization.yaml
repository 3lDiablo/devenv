apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
- includeSelectors: true
  pairs:
    component: postgres

resources:
  - ../../../base/postgres

configMapGenerator:
  - name: postgres-init-scripts
    files:
      - init-db.sql
    options:
      labels:
        component: postgres

patches:
  - path: postgres.yaml
    target:
      kind: Deployment
      name: postgres
