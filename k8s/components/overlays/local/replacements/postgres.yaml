# ==============================================================================
#
#               Kustomize Replacements - PostgreSQL
#
# ==============================================================================
#
# Overview:
#   This file defines a series of "replacements" for the PostgreSQL component.
#   A replacement is a Kustomize directive that says: "Take a value from this
#   source and inject it into these targets."
#
#   This is the primary mechanism used in this project to inject configuration
#   from the central `config.yaml` (via the `global-values` ConfigMap) into the
#   generic base manifests. This approach avoids scattering configuration values
#   across multiple files and keeps the base manifests clean and reusable.
#
# How It Works:
#   - `source`: Defines where to get the value from. In all these cases, the
#     source is a specific `fieldPath` (a key) within the `data` section of the
#     `global-values` ConfigMap.
#   - `targets`: Defines where to inject the value. Each target uses a `select`
#     clause to identify a specific Kubernetes resource (e.g., the `postgres`
#     Deployment) and one or more `fieldPaths` to specify the exact field to be
#     replaced (e.g., `spec.template.spec.containers.0.image`).
#
# ==============================================================================

# --- Replacement for PostgreSQL Database Name ---
- source:
    # Source: The value of the `settings_postgres_db_name` key in the `global-values` ConfigMap.
    fieldPath: data.settings_postgres_db_name
    kind: ConfigMap
    name: global-values
  targets:
  - # Target: The `value` of the first environment variable (`POSTGRES_DB`) in the first container of the `postgres` Deployment.
    fieldPaths:
    - spec.template.spec.containers.0.env.0.value
    select:
      kind: Deployment
      name: postgres

# --- Replacement for PostgreSQL User ---
- source:
    fieldPath: data.settings_postgres_user
    kind: ConfigMap
    name: global-values
  targets:
  - # Target: The `value` of the second environment variable (`POSTGRES_USER`).
    fieldPaths:
    - spec.template.spec.containers.0.env.1.value
    select:
      kind: Deployment
      name: postgres

# --- Replacement for PostgreSQL Password ---
- source:
    fieldPath: data.settings_postgres_password
    kind: ConfigMap
    name: global-values
  targets:
  - # Target: The `value` of the third environment variable (`POSTGRES_PASSWORD`).
    fieldPaths:
    - spec.template.spec.containers.0.env.2.value
    select:
      kind: Deployment
      name: postgres

# --- Replacement for Service NodePort ---
- source:
    # Source: The value of `cluster_ports_1_node`. The index `1` corresponds to the
    # position of the `postgres` entry in the `config.yaml` `ports` array.
    fieldPath: data.cluster_ports_1_node
    kind: ConfigMap
    name: global-values
  targets:
  - # Target: The `nodePort` field of the first port in the `postgres` Service.
    fieldPaths:
    - spec.ports.0.nodePort
    select:
      kind: Service
      name: postgres

# --- Replacement for PostgreSQL Container Image ---
- source:
    # Source: The full image string for postgres (e.g., "docker.io/library/postgres:17.0-alpine").
    fieldPath: data.images_postgres_full
    kind: ConfigMap
    name: global-values
  targets:
  - # Target: The `image` field of the first container in the `postgres` Deployment.
    fieldPaths:
    - spec.template.spec.containers.0.image
    select:
      kind: Deployment
      name: postgres

# --- Replacement for Postgres Exporter Sidecar Image ---
- source:
    fieldPath: data.images_postgres_exporter_full
    kind: ConfigMap
    name: global-values
  targets:
  - # Target: The `image` field of the second container (the sidecar).
    fieldPaths:
    - spec.template.spec.containers.1.image
    select:
      kind: Deployment
      name: postgres

# --- Replacement for PostgreSQL Port ---
- source:
    fieldPath: data.settings_postgres_port
    kind: ConfigMap
    name: global-values
  targets:
  # This replacement targets multiple fields across different resources, ensuring the port is consistent.
  - fieldPaths:
    - spec.template.spec.containers.0.ports.0.containerPort # Pod's container port
    select:
      kind: Deployment
      name: postgres
  - fieldPaths:
    - spec.ports.0.port # Service's internal port
    select:
      kind: Service
      name: postgres
  - fieldPaths:
    - spec.ports.0.targetPort # Service's target port
    select:
      kind: Service
      name: postgres

# --- Replacements for Resource Requests & Limits ---
- source:
    kind: ConfigMap
    name: global-values
    fieldPath: data.settings_postgres_resources_cpu_request
  targets:
    - select:
        kind: Deployment
        name: postgres
      # Target: The CPU request for the main postgres container.
      fieldPaths: [spec.template.spec.containers.0.resources.requests.cpu]
- source:
    kind: ConfigMap
    name: global-values
    fieldPath: data.settings_postgres_resources_cpu_limit
  targets:
    - select:
        kind: Deployment
        name: postgres
      # Target: The CPU limit for the main postgres container.
      fieldPaths: [spec.template.spec.containers.0.resources.limits.cpu]
- source:
    kind: ConfigMap
    name: global-values
    fieldPath: data.settings_postgres_resources_memory_request
  targets:
    - select:
        kind: Deployment
        name: postgres
      # Target: The memory request for the main postgres container.
      fieldPaths: [spec.template.spec.containers.0.resources.requests.memory]
- source:
    kind: ConfigMap
    name: global-values
    fieldPath: data.settings_postgres_resources_memory_limit
  targets:
    - select:
        kind: Deployment
        name: postgres
      # Target: The memory limit for the main postgres container.
      fieldPaths: [spec.template.spec.containers.0.resources.limits.memory]
