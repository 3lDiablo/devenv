# --- Postgres Replacements ---
- source:
    fieldPath: data.settings_postgres_db_name
    kind: ConfigMap
    name: global-values
  targets:
  - fieldPaths:
    - spec.template.spec.containers.0.env.0.value
    select:
      kind: Deployment
      name: postgres
- source:
    fieldPath: data.settings_postgres_user
    kind: ConfigMap
    name: global-values
  targets:
  - fieldPaths:
    - spec.template.spec.containers.0.env.1.value
    select:
      kind: Deployment
      name: postgres
- source:
    fieldPath: data.settings_postgres_password
    kind: ConfigMap
    name: global-values
  targets:
  - fieldPaths:
    - spec.template.spec.containers.0.env.2.value
    select:
      kind: Deployment
      name: postgres
- source:
    fieldPath: data.cluster_ports_1_node
    kind: ConfigMap
    name: global-values
  targets:
  - fieldPaths:
    - spec.ports.0.nodePort
    select:
      kind: Service
      name: postgres
- source:
    fieldPath: data.images_postgres_full
    kind: ConfigMap
    name: global-values
  targets:
  - fieldPaths:
    - spec.template.spec.containers.0.image
    select:
      kind: Deployment
      name: postgres
- source:
    fieldPath: data.settings_postgres_port
    kind: ConfigMap
    name: global-values
  targets:
  - fieldPaths:
    - spec.template.spec.containers.0.ports.0.containerPort
    select:
      kind: Deployment
      name: postgres
  - fieldPaths:
    - spec.ports.0.port
    select:
      kind: Service
      name: postgres
  - fieldPaths:
    - spec.ports.0.targetPort
    select:
      kind: Service
      name: postgres
- source:
    kind: ConfigMap
    name: global-values
    fieldPath: data.settings_postgres_resources_cpu_request
  targets:
    - select:
        kind: Deployment
        name: postgres
      fieldPaths: [spec.template.spec.containers.0.resources.requests.cpu]
- source:
    kind: ConfigMap
    name: global-values
    fieldPath: data.settings_postgres_resources_cpu_limit
  targets:
    - select:
        kind: Deployment
        name: postgres
      fieldPaths: [spec.template.spec.containers.0.resources.limits.cpu]
- source:
    kind: ConfigMap
    name: global-values
    fieldPath: data.settings_postgres_resources_memory_request
  targets:
    - select:
        kind: Deployment
        name: postgres
      fieldPaths: [spec.template.spec.containers.0.resources.requests.memory]
- source:
    kind: ConfigMap
    name: global-values
    fieldPath: data.settings_postgres_resources_memory_limit
  targets:
    - select:
        kind: Deployment
        name: postgres
      fieldPaths: [spec.template.spec.containers.0.resources.limits.memory]
