# ⚡ Orchestration Taskfile (Pure Data Pipeline)
# ---------------------------------------------
# This file is the central orchestrator for the local development environment.
version: '3'

silent: true

# -----------------------------------------------------------------------------
# DYNAMIC VARIABLES
# -----------------------------------------------------------------------------
vars:
  CLUSTER_NAME: { sh: "yq eval '.cluster.name' config.yaml" }
  PROVIDER: { sh: "yq eval '.cluster.provider' config.yaml" }
  KAFKA_NAME: { sh: "yq eval '.settings.kafka.cluster_name' config.yaml" }
  CONTEXT: "kind-{{.CLUSTER_NAME}}"
  TLS_FLAG: '{{if eq .PROVIDER "podman"}}--tls-verify=false{{end}}'

env:
  KIND_EXPERIMENTAL_PROVIDER: "{{.PROVIDER}}"

tasks:
  default:
    cmds:
      - task: --list

  # ===========================================================================
  # PRIMARY PIPELINE
  # ===========================================================================

  up:
    desc: "Initialize the full environment from scratch."
    cmds:
      - task: check:deps
      - task: render
      - task: cluster:create
      - task: cluster:load-images
      - task: init:namespace
      - task: deploy:all

  down:
    desc: "Nuclear Reset: Deletes cluster and generated files."
    cmds:
      - |
        echo "🔥 Deleting cluster {{.CLUSTER_NAME}}..."
        kind delete cluster --name "{{.CLUSTER_NAME}}"
      - |
        echo "🧹 Performing hard cleanup..."
        {{.PROVIDER}} volume prune -f >/dev/null 2>&1 || true
        {{.PROVIDER}} network rm kind >/dev/null 2>&1 || true
      - rm -rf k8s/cluster/kind.yaml k8s/components/overlays/local/*.yaml k8s/components/overlays/local/*.json k8s/components/overlays/local/*.conf definitions/rendered/*.yaml

  # ===========================================================================
  # STAGE 1: DATA RENDERING
  # ===========================================================================

  render:
    desc: "Render all templates using config.yaml as the Source of Truth."
    cmds:
      - task: render:kind
      - task: render:values
      - task: render:cloudbeaver
      - task: render:redpanda
      - task: render:karapace
      - task: render:topics

  render:kind:
    internal: true
    cmds:
      - |
        yq eval 'explode(.)' config.yaml | yq eval-all '
          select(fileIndex == 0) as $base |
          select(fileIndex == 1) as $cfg |
          $base |
          .nodes[0].image = $cfg.cluster.node_image |
          .nodes[0].extraPortMappings = ($cfg.cluster.ports | map({
            "containerPort": .node,
            "hostPort": .host,
            "listenAddress": "0.0.0.0",
            "protocol": "TCP"
          }))
        ' k8s/cluster/kind-config.base.yaml - > k8s/cluster/kind.yaml

  render:values:
    internal: true
    cmds:
      - |
        echo "apiVersion: v1" > k8s/components/overlays/local/values.yaml
        echo "kind: ConfigMap" >> k8s/components/overlays/local/values.yaml
        echo "metadata:" >> k8s/components/overlays/local/values.yaml
        echo "  name: global-values" >> k8s/components/overlays/local/values.yaml
        echo "  namespace: infrastructure" >> k8s/components/overlays/local/values.yaml
        echo "data:" >> k8s/components/overlays/local/values.yaml
        yq eval 'explode(.)' config.yaml | yq eval '.. | select(tag == "!!str" or tag == "!!int" or tag == "!!bool") | "  " + (path | join("_")) + ": \"" + . + "\""' - >> k8s/components/overlays/local/values.yaml
        yq eval '.images | to_entries | .[] | "  images_" + .key + "_full: \"" + .value.registry + (select(.value.repository) | "/" + .value.repository) + ":" + .value.tag + "\""' config.yaml >> k8s/components/overlays/local/values.yaml
        echo "  # JVM Auto-Sizing" >> k8s/components/overlays/local/values.yaml
        for component in kafka schema_registry kafka_connect entity_operator; do
          MEM_LIMIT=$(yq eval ".settings.${component}.resources.memory.limit" config.yaml)
          if [ "$MEM_LIMIT" != "null" ]; then
            if [[ $MEM_LIMIT == *Gi ]]; then
              MEM_MB=$(echo "${MEM_LIMIT%Gi} * 1024" | bc | cut -d. -f1)
            else
              MEM_MB=$(echo "${MEM_LIMIT%Mi}" | bc | cut -d. -f1)
            fi
            JVM_MB=$(echo "$MEM_MB * 0.7 / 1" | bc | cut -d. -f1)
            echo "  settings_${component}_jvm_xms: \"${JVM_MB}m\"" >> k8s/components/overlays/local/values.yaml
            echo "  settings_${component}_jvm_xmx: \"${JVM_MB}m\"" >> k8s/components/overlays/local/values.yaml
            echo "  settings_${component}_java_options: \"-Xms${JVM_MB}m -Xmx${JVM_MB}m\"" >> k8s/components/overlays/local/values.yaml
          fi
        done

  render:cloudbeaver:
    internal: true
    cmds:
      - |
        PG_USER=$(yq e '.settings.postgres.user' config.yaml)
        PG_PASS=$(yq e '.settings.postgres.password' config.yaml)
        yq e ".connections.\"postgres-local\".configuration.user = \"$PG_USER\" | .connections.\"postgres-local\".configuration.password = \"$PG_PASS\"" \
               k8s/components/base/cloudbeaver/data-sources.json.tpl > k8s/components/overlays/local/data-sources.json
        yq e ".server.database.url = \"jdbc:postgresql://postgres:5432/$(yq e '.settings.cloudbeaver.db_name' config.yaml)\" | .server.database.user = \"$PG_USER\" | .server.database.password = \"$PG_PASS\"" \
               k8s/components/base/cloudbeaver/cloudbeaver.conf.tpl > k8s/components/overlays/local/cloudbeaver.conf
        yq e '.' k8s/components/base/cloudbeaver/initial-data.conf.tpl > k8s/components/overlays/local/initial-data.conf

  render:redpanda:
    internal: true
    cmds:
      - |
        KAFKA_PORT=$(yq e '.settings.kafka.port' config.yaml)
        SR_PORT=$(yq e '.settings.schema_registry.port' config.yaml)
        KC_PORT=$(yq e '.settings.kafka_connect.port' config.yaml)
        yq e ".kafka.brokers[0] = \"kafka-cluster-kafka-bootstrap:$KAFKA_PORT\" |
              .schemaRegistry.urls[0] = \"http://schema-registry:$SR_PORT/apis/ccompat/v7\" |
              .kafkaConnect.clusters[0].url = \"http://kafka-connect-api.infrastructure:$KC_PORT\"" \
               k8s/components/base/redpanda/console-config.yaml.tpl > k8s/components/overlays/local/redpanda-console-config.yaml

  render:karapace:
    internal: true
    cmds:
      - |
        KAFKA_PORT=$(yq e '.settings.kafka.port' config.yaml)
        SR_PORT=$(yq e '.settings.schema_registry.port' config.yaml)
        KARAPACE_PORT=$(yq e '.settings.karapace_rest.port' config.yaml)
        yq e ".port = $KARAPACE_PORT | .bootstrap_uri = \"kafka-cluster-kafka-bootstrap:$KAFKA_PORT\" | .registry_port = $SR_PORT | .log_level = \"DEBUG\"" \
            k8s/components/base/karapace/karapace.config.json.tpl > k8s/components/overlays/local/karapace/karapace.config.json
        yq e '.log_level = "DEBUG"' k8s/components/base/karapace/rest-proxy-karapace.config.json.tpl > k8s/components/overlays/local/karapace/rest-proxy-karapace.config.json

  render:topics:
    internal: true
    cmds:
      - |
        mkdir -p definitions/rendered
        CLUSTER_NAME=$(yq e '.settings.kafka.cluster_name' config.yaml)
        for f in definitions/topics/*.json; do
          TOPIC_NAME=$(jq -r '.topic_name' "$f")
          PARTITIONS=$(jq -r '.partitions_count // 6' "$f")
          REPLICATION=$(jq -r '.replication_factor // 1' "$f")
          yq e ".metadata.name = \"$TOPIC_NAME\" | 
                .metadata.namespace = \"infrastructure\" | 
                .metadata.labels.\"strimzi.io/cluster\" = \"$CLUSTER_NAME\" |
                .spec.partitions = $PARTITIONS |
                .spec.replicas = $REPLICATION" k8s/components/base/kafka/topics/topic.yaml.tpl > "definitions/rendered/$TOPIC_NAME.yaml"
          yq e -i ".spec.config = $(jq -c '.config // {}' "$f")" "definitions/rendered/$TOPIC_NAME.yaml"
        done

  # ===========================================================================
  # STAGE 2: CLUSTER LIFECYCLE
  # ===========================================================================

  cluster:create:
    cmds:
      - kind create cluster --name "{{.CLUSTER_NAME}}" --config k8s/cluster/kind.yaml
    status:
      - |
        kind get clusters | grep -q "^{{.CLUSTER_NAME}}$" && 
        kubectl cluster-info --context {{.CONTEXT}} >/dev/null 2>&1

  cluster:load-images:
     cmds:
       - |
         IMAGES=$(yq eval '.images | .. | select(has("repository")) | .registry + "/" + .repository + ":" + .tag' config.yaml | sort | uniq)
         for img in $IMAGES; do
           if ! {{.PROVIDER}} exec {{.CLUSTER_NAME}}-control-plane crictl images | grep -q "${img%%:*}" >/dev/null 2>&1; then
             echo "🚚 Image $img not in cluster. Checking host..."
             {{.PROVIDER}} image inspect "$img" >/dev/null 2>&1 || {{.PROVIDER}} pull {{.TLS_FLAG}} "$img"
             echo "📦 Loading $img into cluster {{.CLUSTER_NAME}}..."
             {{.PROVIDER}} save "$img" | kind load image-archive /dev/stdin --name "{{.CLUSTER_NAME}}"
           fi
         done

  stop:
    desc: "Pause the environment (stop cluster nodes)."
    cmds:
      - |
        echo "⏸️  Stopping cluster nodes..."
        {{.PROVIDER}} stop {{.CLUSTER_NAME}}-control-plane
      - echo "✅ Cluster paused. Run 'task start' to resume."

  start:
    desc: "Resume a paused environment, or create it if it doesn't exist."
    cmds:
      - |
        if ! kind get clusters | grep -q "^{{.CLUSTER_NAME}}$"; then
          echo "Cluster not found. Running 'task up' instead..."
          task up
        else
          echo "▶️  Starting cluster nodes..."
          {{.PROVIDER}} start {{.CLUSTER_NAME}}-control-plane
          echo "⏳ Waiting for Kubernetes API to be ready..."
          kubectl wait --for=condition=Ready nodes --all --timeout=60s --context {{.CONTEXT}}
          echo "🚀 Cluster resumed and ready."
        fi

  # ===========================================================================
  # STAGE 3: MODULAR DEPLOYMENT
  # ===========================================================================

  deploy:all:
    desc: "Parallelized deployment of modular overlays."
    deps:
      - deploy:metrics-server
      - deploy:postgres
      - deploy:strimzi
      - deploy:cloudbeaver
      - deploy:kafka:nodepools
      - deploy:kafka:cluster
      - deploy:schema-registry
      - deploy:kafka:connect
      - deploy:redpanda
      - deploy:karapace
      - provision:kafka

  deploy:metrics-server:
    run: once
    cmds:
      - echo "🏗️  Installing Metrics Server..."
      - kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml --context "{{.CONTEXT}}"
      - echo "🔧 Patching Metrics Server for insecure TLS (required for Kind)..."
      - |
        kubectl patch deployment metrics-server -n kube-system --type='json' \
          -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]' \
          --context "{{.CONTEXT}}"
      - kubectl wait deployment/metrics-server -n kube-system --for=condition=Available --timeout=60s --context "{{.CONTEXT}}"

  deploy:strimzi:
    run: once
    deps: [init:namespace]
    cmds:
      - echo "🏗️  Deploying Strimzi Operator..."
      - kustomize build k8s/components/overlays/local | yq 'select(.metadata.labels.component == "strimzi")' | kubectl apply -f - --context "{{.CONTEXT}}"
      - echo "⏳ Waiting for Strimzi CRDs..."
      - kubectl wait --for=condition=Established crd/kafkatopics.kafka.strimzi.io --timeout=60s --context "{{.CONTEXT}}"
      - kubectl wait deployment/strimzi-cluster-operator -n infrastructure --for=condition=Available --timeout=60s --context "{{.CONTEXT}}"

  deploy:postgres:
    run: once
    deps: [init:namespace]
    cmds:
      - echo "🏗️  Deploying Postgres Database..."
      - kustomize build k8s/components/overlays/local | yq 'select(.metadata.labels.component == "postgres")' | kubectl apply -f - --context "{{.CONTEXT}}"
      - kubectl wait deployment/postgres -n infrastructure --for=condition=Available --timeout=120s --context "{{.CONTEXT}}"

  deploy:cloudbeaver:
    run: once
    deps: [deploy:postgres]
    cmds:
      - echo "🏗️  Deploying CloudBeaver..."
      - kustomize build k8s/components/overlays/local | yq 'select(.metadata.labels.component == "cloudbeaver")' | kubectl apply -f - --context "{{.CONTEXT}}"

  deploy:kafka:nodepools:
    run: once
    deps: [deploy:strimzi]
    cmds:
      - echo "🏗️  Deploying Kafka NodePools..."
      - kustomize build k8s/components/overlays/local | yq 'select(.metadata.labels.component == "kafka-nodepool")' | kubectl apply -f - --context "{{.CONTEXT}}"

  deploy:kafka:cluster:
    run: once
    deps: [deploy:kafka:nodepools]
    cmds:
      - echo "🏗️  Deploying Kafka Cluster..."
      - kustomize build k8s/components/overlays/local | yq 'select(.metadata.labels.component == "kafka-cluster")' | kubectl apply -f - --context "{{.CONTEXT}}"
      - kubectl wait kafka/{{.KAFKA_NAME}} -n infrastructure --for=condition=Ready --timeout=300s --context "{{.CONTEXT}}"

  deploy:schema-registry:
    run: once
    deps: [deploy:kafka:cluster]
    cmds:
      - echo "🏗️  Deploying Schema Registry..."
      - kustomize build k8s/components/overlays/local | yq 'select(.metadata.labels.component == "schema-registry")' | kubectl apply -f - --context "{{.CONTEXT}}"
      - kubectl wait deployment/schema-registry -n infrastructure --for=condition=Available --timeout=120s --context "{{.CONTEXT}}"

  deploy:kafka:connect:
    run: once
    deps: [deploy:kafka:cluster, deploy:schema-registry]
    cmds:
      - echo "🏗️  Deploying Kafka Connect..."
      - kustomize build k8s/components/overlays/local | yq 'select(.metadata.labels.component == "kafka-connect")' | kubectl apply -f - --context "{{.CONTEXT}}"

  deploy:redpanda:
    run: once
    deps: [deploy:schema-registry, deploy:kafka:connect]
    cmds:
      - echo "🏗️  Deploying Redpanda Console..."
      - kustomize build k8s/components/overlays/local | yq 'select(.metadata.labels.component == "redpanda")' | kubectl apply -f - --context "{{.CONTEXT}}"

  deploy:karapace:
    run: once
    deps: [deploy:schema-registry]
    cmds:
      - echo "🏗️  Deploying Karapace REST Proxy..."
      - kustomize build k8s/components/overlays/local | yq 'select(.metadata.labels.component == "karapace")' | kubectl apply -f - --context "{{.CONTEXT}}"

  provision:kafka:
    desc: "Provision topics and schemas from definitions."
    deps: [deploy:kafka:cluster, deploy:schema-registry]
    cmds:
      - echo "🚀 Provisioning Kafka resources..."
      - kubectl apply -f definitions/rendered/ --context "{{.CONTEXT}}"
      - |
        SR_PORT=$(yq e '.settings.schema_registry.port' config.yaml)
        REGISTRY_URL="http://localhost:${SR_PORT}/apis/ccompat/v7"
        
        echo "⏳ Waiting for Schema Registry API to be responsive..."
        MAX_RETRIES=30
        COUNT=0
        while ! curl -s -f "$REGISTRY_URL/subjects" > /dev/null; do
          [ $COUNT -eq $MAX_RETRIES ] && echo "❌ Schema Registry timed out" && exit 1
          sleep 2
          COUNT=$((COUNT + 1))
        done

        for f in definitions/topics/*.json; do
          TOPIC_NAME=$(jq -r '.topic_name' "$f")
          jq -c '.values[]?' "$f" | while read -r schema_ref; do
            SCHEMA_NAME=$(echo "$schema_ref" | jq -r '.schema')
            for ext in avsc avdl json; do
              if [ -f "definitions/schemas/$SCHEMA_NAME.$ext" ]; then
                echo "📝 Registering schema for $TOPIC_NAME: $SCHEMA_NAME..."
                RESPONSE=$(curl -s -X POST -H "Content-Type: application/vnd.schemaregistry.v1+json" \
                     --data "{\"schema\": $(jq -Rs . "definitions/schemas/$SCHEMA_NAME.$ext")}" \
                     "$REGISTRY_URL/subjects/${TOPIC_NAME}-value/versions")
                ID=$(echo $RESPONSE | jq -r '.id // empty')
                if [ -n "$ID" ]; then
                  echo "✅ Schema registered successfully (ID: $ID)"
                else
                  echo "❌ Failed to register schema: $RESPONSE"
                fi
                break
              fi
            done
          done
        done

  # ===========================================================================
  # UTILITIES
  # ===========================================================================

  status:
    desc: "Check health and resource usage of all components."
    cmds:
      - echo "📊 Component Status & Resource Usage (Namespace infrastructure)"
      - |
        # Headers with wider name column and clear separators
        printf "%-50s %-12s | %-8s %-8s %-8s | %-8s %-8s %-8s\n" "POD" "STATUS" "CPU REQ" "CPU LIM" "CPU USE" "MEM REQ" "MEM LIM" "MEM USE"
        printf "%-50s %-12s | %-8s %-8s %-8s | %-8s %-8s %-8s\n" "--------------------------------------------------" "------" "-------" "-------" "-------" "-------" "-------" "-------"
        
        # Get pod list and status
        PODS=$(kubectl get pods -n infrastructure --context "{{.CONTEXT}}" -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\n"}{end}')
        
        # Get usage metrics
        METRICS=$(kubectl top pods -n infrastructure --context "{{.CONTEXT}}" --no-headers 2>/dev/null || true)
        
        while read -r line; do
          [ -z "$line" ] && continue
          NAME=$(echo "$line" | cut -f1)
          PHASE=$(echo "$line" | cut -f2)
          
          # Extract Requests/Limits using a single call to optimize
          JSON=$(kubectl get pod "$NAME" -n infrastructure --context "{{.CONTEXT}}" -o json 2>/dev/null || echo "{}")
          REQ_CPU=$(echo "$JSON" | jq -r '.spec.containers[0].resources.requests.cpu // "-"' 2>/dev/null)
          LIM_CPU=$(echo "$JSON" | jq -r '.spec.containers[0].resources.limits.cpu // "-"' 2>/dev/null)
          REQ_MEM=$(echo "$JSON" | jq -r '.spec.containers[0].resources.requests.memory // "-"' 2>/dev/null)
          LIM_MEM=$(echo "$JSON" | jq -r '.spec.containers[0].resources.limits.memory // "-"' 2>/dev/null)
          
          # Extract Usage
          USE_CPU=$(echo "$METRICS" | grep "^$NAME " | awk '{print $2}' || echo "0m")
          USE_MEM=$(echo "$METRICS" | grep "^$NAME " | awk '{print $3}' || echo "0Mi")
          
          printf "%-50s %-12s | %-8s %-8s %-8s | %-8s %-8s %-8s\n" "$NAME" "$PHASE" "$REQ_CPU" "$LIM_CPU" "$USE_CPU" "$REQ_MEM" "$LIM_MEM" "$USE_MEM"
        done <<< "$PODS"

  status:watch:
    desc: "Watch component status and resource usage in real-time."
    cmds:
      - watch -n 2 task status

  init:namespace:
    internal: true
    cmds:
      - kubectl create namespace infrastructure --dry-run=client -o yaml | kubectl apply -f - --context "{{.CONTEXT}}"

  check:deps:
    internal: true
    cmds:
      - |
        MISSING_DEPS=""
        for tool in kind kubectl yq jq bc curl watch; do
          if ! command -v $tool &> /dev/null; then
            MISSING_DEPS="$MISSING_DEPS $tool"
          fi
        done

        if [ -n "$MISSING_DEPS" ]; then
          echo "❌ Missing dependencies: $MISSING_DEPS"
          if command -v brew &> /dev/null; then
            read -p "❓ Do you want to install them via Homebrew? (y/n) " REPLY
            echo
            if [[ $REPLY =~ ^[Yy]$ ]]; then
              for tool in $MISSING_DEPS; do
                echo "📦 Installing $tool..."
                brew install $tool
              done
            else
              echo "⚠️  Please install the missing dependencies manually."
              exit 1
            fi
          else
            echo "⚠️  Homebrew not found. Please install missing dependencies manually."
            exit 1
          fi
        fi
        echo "✅ All dependencies found."
